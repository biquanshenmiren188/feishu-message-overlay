[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/robot-push/server.py --cloud-config-directory /var/lib/robot-push-private --expected-app-id-file /etc/robot-push/app-id --cloud-mode
ReadWritePaths=/var/lib/robot-push-private
MemoryMax=192M
CPUQuota=20%
TasksMax=32
Environment=NODE_OPTIONS=--max-old-space-size=96
KillMode=control-group
TimeoutStopSec=12
StandardOutput=null
StandardError=null
