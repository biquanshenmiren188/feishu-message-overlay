location = /radar/api/robot-push/publish {
    limit_except POST { deny all; }
    limit_req zone=robot_push_publish burst=10 nodelay;
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    client_body_timeout 6s;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:18883;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    access_log off;
}
location = /radar/robot-push/feed.json {
    limit_except GET { deny all; }
    alias /var/lib/robot-push/feed.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
