# Include inside the existing radar HTTPS server, alongside robot-push.conf.
location ^~ /radar/api/pushward/ {
    limit_req zone=robot_push_publish burst=6 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    client_body_buffer_size 16k;
    client_body_timeout 6s;
    proxy_pass http://127.0.0.1:18884;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    error_log /dev/null crit;
}
