location = /radar/push-test {
    return 302 /radar/push-test/;
}
location ^~ /radar/push-test/api/ {
    proxy_pass http://127.0.0.1:18885;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    client_max_body_size 8k;
    access_log off;
    add_header Cache-Control "no-store" always;
}
location ^~ /radar/push-test/ {
    alias /opt/radar-webpush-test/public/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
