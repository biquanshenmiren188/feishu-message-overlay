name: Cloud reader authorization
on:
  push:
    # PR checks cover feature branches; main is checked after merge.
    branches: [main]
    paths:
      - 'web/robot-push/publisher/**'
      - 'web/push-test/**'
      - '.github/workflows/cloud-reader.yml'
  pull_request:
    paths:
      - 'web/robot-push/publisher/**'
      - 'web/push-test/**'
      - '.github/workflows/cloud-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  authorization:
    if: github.repository == 'biquanshenmiren188/feishu-message-overlay' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install cryptography -r web/push-test/requirements.txt
      - run: python web/robot-push/publisher/reader_auth_test.py
      - run: python web/robot-push/publisher/desktop_cards_test.py
      - run: python web/robot-push/publisher/state_delta_test.py
      - run: python web/robot-push/publisher/cloud_config_test.py
      - run: python web/robot-push/publisher/cloud_receiver_test.py
      - run: python -m unittest discover -s web/push-test -p '*_test.py'
      - run: python -m unittest discover -s web/robot-push/publisher -p '*_test.py'
