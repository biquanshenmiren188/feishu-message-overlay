name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_package:
        description: 'Upload the Windows package (retained for 3 days)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Official SDK dependency and synthetic gate checks
        shell: pwsh
        run: |
          npm ci --prefix bridge --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Bridge restore failed' }
          node --check bridge/main.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bridge syntax failed' }
          node --check bridge/register.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Registration syntax failed' }
          node --check bridge/discover.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic syntax failed' }
          node --check bridge/diagnostic-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic fixture syntax failed' }
          npm test --prefix bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge checks failed' }
      - name: Core checks and portable publish
        shell: pwsh
        run: ./scripts/build.ps1 -SelfContained
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: WPF-smoke-diagnostics
          retention-days: 3
          path: |
            artifacts/verification/ci-smoke/ui-smoke.txt
            artifacts/verification/ci-smoke/stdout.txt
            artifacts/verification/ci-smoke/stderr.txt
            artifacts/verification/ci-smoke/font-fit-runtime.json
            artifacts/verification/ci-smoke/current-runtime-contract.json
            artifacts/verification/ci-smoke/card-fit-check.json
            artifacts/verification/ci-smoke/card-runtime.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_package
        with:
          name: FeishuMessageOverlay-win-x64
          path: artifacts/FeishuMessageOverlay-win-x64.zip
          retention-days: 3
